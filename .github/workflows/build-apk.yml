name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # llama.cpp is vendored as a submodule and compiled by the NDK.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          set -euo pipefail
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          echo "Installing NDK $ndk"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Without an accepted license sdkmanager skips the package and still
          # exits 0, so accept first and then check the directory really exists.
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;$ndk"
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            echo "::error::NDK $ndk was not installed."
            exit 1
          fi
          echo "NDK ready at $ANDROID_HOME/ndk/$ndk"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Android 15+ devices (the realme 15 among them) use 16 KB memory pages.
      # A shared library linked for 4 KB pages will not load there at all, so
      # fail here rather than on the phone. This covers every .so in the APK,
      # including ones dependencies bring in — those break the app just as hard.
      - name: Check native libraries are 16 KB aligned
        run: |
          set -euo pipefail

          # -print -quit rather than `| head -1`: under pipefail, head closing
          # the pipe can make find exit 141 and take the step down with it.
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -o -q "$apk" -d /tmp/apkcheck

          libs=$(find /tmp/apkcheck/lib -name '*.so' -print 2>/dev/null || true)
          if [ -z "$libs" ]; then
            echo "::error::No native libraries in the APK — llama.cpp did not build."
            exit 1
          fi

          # The NDK's readelf if the NDK is installed, otherwise whatever the
          # runner has. Looking inside a directory that may not exist is what
          # broke this check the first time.
          readelf=""
          if [ -d "${ANDROID_HOME:-}/ndk" ]; then
            readelf=$(find "$ANDROID_HOME/ndk" -name 'llvm-readelf' -print -quit || true)
          fi
          if [ -z "$readelf" ]; then
            readelf=$(command -v llvm-readelf || command -v readelf || true)
          fi
          if [ -z "$readelf" ]; then
            echo "::error::No readelf found to verify alignment."
            exit 1
          fi
          echo "Using $readelf"

          fail=0
          while IFS= read -r so; do
            align=$("$readelf" -l "$so" | awk '/LOAD/ {print $NF; exit}')
            case "$align" in
              0x4000|0x10000) echo "ok    $align  $(basename "$so")" ;;
              *) echo "::error::$(basename "$so") is aligned $align, needs 16 KB"; fail=1 ;;
            esac
          done <<< "$libs"
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: REMOVED-OLD-KEYSTORE-PASSWORD-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
