name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Three runs of this ended up in flight at once and starved each other of
# runner capacity — a lint step that normally takes seven minutes sat at
# twenty. Only the newest commit on a branch is worth building.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # llama.cpp is vendored as a submodule and compiled by the NDK.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          set -euo pipefail
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          echo "Installing NDK $ndk"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Without an accepted license sdkmanager skips the package and still
          # exits 0, so accept first and then check the directory really exists.
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;$ndk"
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            echo "::error::NDK $ndk was not installed."
            exit 1
          fi
          echo "NDK ready at $ANDROID_HOME/ndk/$ndk"

      # There is no key in the repository any more, so without the secret the
      # build falls back to AGP's own debug key and the fingerprint check below
      # fails — loudly, rather than shipping an APK that cannot install over
      # what is on the phone.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            # A pull request from a fork never receives secrets, so demanding
            # one there would fail every PR for a reason that has nothing to do
            # with the change. The build still proves the code compiles; it just
            # does not produce an installable APK, and the check below is
            # skipped rather than asserting against a key that was never used.
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::warning::No signing secret on a pull request; building unsigned-over."
              exit 0
            fi
            echo "::error::KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          # A truncated or mangled secret would otherwise sail through and
          # produce an APK signed with a different key — which installs over
          # nothing and is only discovered on the phone.
          if [ ! -s release.keystore ]; then
            echo "::error::KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          echo "Signing key restored from the repository secret."

      - name: Verify the model download links still work
        run: |
          set -uo pipefail
          # These hosts are unreachable from where this project is written, so
          # the URLs in the catalog cannot be checked there. A dead link is only
          # discovered as a failed multi-gigabyte download otherwise.
          # downloadUrl is written as two concatenated literals, so join the
          # file's lines before matching.
          urls=$(tr -d '\n' < app/src/main/java/com/mubashir/jarvis/model/ModelCatalog.kt \
            | sed 's/" *+ *"//g' \
            | grep -oE 'https://[^"]+\.gguf[^"]*' | sort -u)
          if [ -z "$urls" ]; then
            echo "::error::No model URLs found to check."
            exit 1
          fi
          fail=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo 000)
            case "$code" in
              200|302) echo "ok   $code  $url" ;;
              *) echo "::error::$code for $url"; fail=1 ;;
            esac
          done <<< "$urls"
          exit $fail

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        # The password goes through the environment, not the command line, so it
        # does not show up in a process list or a build scan.
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PjarvisVersionCode=${{ github.run_number }} \
            -PjarvisVersionName=0.3.${{ github.run_number }}

      # ggml dlopens its CPU backends out of the app's native library directory,
      # which is only populated when the libraries are extracted at install
      # time. Packaged instead, that directory is empty and every model fails to
      # load. The setting lives in the packaging DSL, so assert on what actually
      # reaches the merged manifest rather than trusting it landed.
      - name: Check native libraries are extracted at install time
        run: |
          set -uo pipefail
          manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -print -quit)
          if [ -z "$manifest" ]; then
            echo "::error::No merged manifest found to check."
            exit 1
          fi
          echo "Merged manifest: $manifest"
          if grep -q 'extractNativeLibs="true"' "$manifest"; then
            echo "ok  extractNativeLibs=true"
          else
            echo "::error::extractNativeLibs is not true in the merged manifest — ggml will find no backends and every model load will fail."
            grep -o 'extractNativeLibs="[^"]*"' "$manifest" || echo "(attribute absent entirely)"
            exit 1
          fi

      # The whole point of a fixed key is that an update installs over the last
      # build. A secret that decoded to the wrong bytes, or a silent fall back to
      # AGP's own debug key, produces a green build and an APK that will not
      # install — discovered only on the phone, by which time the fix is an
      # uninstall that deletes the model.
      - name: Check the APK is signed with the expected key
        run: |
          set -uo pipefail
          if [ ! -f release.keystore ]; then
            echo "No signing key was restored (pull request); nothing to assert."
            exit 0
          fi
          expected="62C85F7A0ACCF60A27A3122214038751139358310840F72C3153A7FF6777E4BC"
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -print | sort | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi
          got=$("$apksigner" verify --print-certs "$apk" \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' \
            | tr -d ':' | tr 'a-f' 'A-F')
          want=$(printf '%s' "$expected" | tr -d ':')
          if [ "$got" != "$want" ]; then
            echo "::error::APK signed with an unexpected key."
            echo "  expected $want"
            echo "  got      $got"
            exit 1
          fi
          echo "ok  signed with the expected key"

      # Upload before the alignment check so a problem there still leaves an
      # installable APK to look at.
      - uses: actions/upload-artifact@v4
        with:
          name: REMOVED-OLD-KEYSTORE-PASSWORD-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Android 15+ devices (the realme 15 among them) use 16 KB memory pages.
      # A shared library linked for 4 KB pages will not load there at all, so
      # report it here rather than on the phone. Every .so in the APK counts,
      # including ones dependencies bring in.
      - name: Check native libraries are 16 KB aligned
        run: |
          set -uo pipefail

          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -o -q "$apk" -d /tmp/apkcheck || {
            echo "::error::unzip failed with $?"
            exit 1
          }

          libs=$(find /tmp/apkcheck/lib -name '*.so' -print 2>/dev/null || true)
          if [ -z "$libs" ]; then
            echo "::error::No native libraries in the APK — llama.cpp did not build."
            exit 1
          fi
          echo "Found $(printf '%s\n' "$libs" | wc -l) native libraries"

          # Pinned to the NDK this workflow installed. GNU readelf wraps each
          # LOAD over two lines and the parse below reads the wrong field from
          # it, reporting every library as misaligned — so falling back to
          # whatever readelf is on PATH produces a confident, wrong answer.
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          readelf="$ANDROID_HOME/ndk/$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [ ! -x "$readelf" ]; then
            readelf="$(command -v llvm-readelf || true)"
          fi
          if [ -z "$readelf" ] || [ ! -x "$readelf" ]; then
            echo "::error::llvm-readelf not found; refusing to guess with GNU readelf."
            exit 1
          fi
          echo "Using $readelf"

          fail=0
          count=0
          while IFS= read -r so; do
            [ -n "$so" ] || continue
            count=$((count + 1))
            # Capture rather than pipe, and let awk read to EOF: a pipeline that
            # closes early here is what made this step die mid-loop before.
            if ! out=$("$readelf" -l "$so" 2>&1); then
              echo "::error::readelf failed on $(basename "$so"): $out"
              fail=1
              continue
            fi
            align=$(printf '%s\n' "$out" | awk '/LOAD/ && !seen { print $NF; seen = 1 }')
            case "$align" in
              0x4000|0x10000) echo "ok    $align  $(basename "$so")" ;;
              *) echo "::error::$(basename "$so") is aligned ${align:-unknown}, needs 16 KB"
                 fail=1 ;;
            esac
          done <<< "$libs"

          echo "Checked $count libraries; fail=$fail"
          exit $fail

      # Last, deliberately. Lint takes between seven and twenty minutes on this
      # project, and nothing about it decides whether the APK works — so it must
      # not stand between a push and an installable build.
      - name: Lint
        run: ./gradlew lintDebug --no-daemon
